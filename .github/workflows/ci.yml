# Intégration continue : compile et lance tous les tests (base H2 en mémoire, sans MariaDB ni .env).
# À rendre obligatoire avant fusion dans main et develop (protection de branches GitHub).
name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Une nouvelle exécution sur la même branche annule la précédente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler et tester
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publier les rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: target/surefire-reports/
          retention-days: 7
