# Intégration continue : compile, lance tous les tests (MariaDB via Testcontainers, Docker fourni
# par le runner, sans .env) et vérifie la couverture de tests (JaCoCo).
# À rendre obligatoire avant fusion dans main et develop (protection de branches GitHub).
name: CI

on:
  push:
    branches: [main, develop, 'release/**', 'hotfix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Une nouvelle exécution sur la même branche annule la précédente
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build et tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compiler et tester
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Publier les rapports de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rapports-tests
          path: target/surefire-reports/
          retention-days: 7
