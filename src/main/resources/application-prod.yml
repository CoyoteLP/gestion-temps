# Profil de production : MariaDB, paramètres fournis par variables d'environnement.
# Les migrations Flyway sont appliquées au démarrage, puis Hibernate valide le schéma.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

# Documentation OpenAPI (/v3/api-docs, /swagger-ui.html) : désactivée en production sauf OPENAPI_ACTIVE=true
springdoc:
  api-docs:
    enabled: ${OPENAPI_ACTIVE:false}
  swagger-ui:
    enabled: ${OPENAPI_ACTIVE:false}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          audiences: ${OIDC_AUDIENCE}
