# Profil de production : MariaDB, paramètres fournis par variables d'environnement.
# Les migrations Flyway sont appliquées au démarrage, puis Hibernate valide le schéma.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
          audiences: ${OIDC_AUDIENCE}
