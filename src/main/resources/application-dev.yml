# Profil de développement : MariaDB locale, schéma créé par les migrations Flyway.
# Les informations de connexion ne sont pas versionnées : elles sont lues dans le fichier .env à la
# racine du projet (copie de .env.example, ignorée par Git) ou dans les variables d'environnement,
# qui restent prioritaires.
spring:
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    show-sql: true
